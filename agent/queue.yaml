# Autonomous improvement queue.
#
# The chess-mod-improver chat mode reads this file top-to-bottom and processes
# every entry whose status is "pending", honouring severity then phase order.
# Entries with status: example are documentation / schema reference and are
# always skipped.
#
# Schema (see `.github/copilot-instructions.md` → Queue entry schema):
#   id, mod, status, kind, phase, severity,
#   evidence: { report, line, fen, move },
#   blunder_threshold_cp, notes.
#
# Status values: pending | in_progress | done | failed | blocked | example
#
# When the agent files a NEW finding (per the take-initiative directive) it
# appends an entry below the last existing one and never rewrites unrelated
# entries.

# ===========================================================================
# Bootstrap: refresh every baseline before any per-mod work runs.
# ===========================================================================

- id: bootstrap-baselines-all
  mod: shared
  status: pending
  kind: kpi_regression
  phase: strategy
  severity: high
  evidence:
    report: agent/reports/_shared/bootstrap-baselines.txt
  blunder_threshold_cp: 200
  notes: "Generate fresh ≥50-game baselines for all seven mods at depth=6 / time_ms=500 / skill=4 and write each to agent/baselines/<mod>.json. Pre-req for every other task."

