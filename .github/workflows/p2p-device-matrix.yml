# §L8 P2P device matrix CI — cross-platform regression on release branches
#
# Proof artefact for Phase 5 leaf L8 (Cross-platform device matrix).
# Runs on release branches only (not on every main push) to keep cost low.
# Uses GitHub Actions matrix; physical device farm (BrowserStack / Firebase
# Test Lab) is wired in the `device-farm` job (requires org-level secrets).
#
# Layers covered: L8 — cross-platform, plus L4 (engine-correlation) on each OS.

name: P2P Device Matrix

on:
  push:
    branches:
      - 'release/**'
      - 'release-p2p/**'
  workflow_dispatch:
    inputs:
      run_device_farm:
        description: 'Run physical device farm jobs (requires BrowserStack/FTL secrets)'
        required: false
        default: 'false'

concurrency:
  group: p2p-device-matrix-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.38.5'

jobs:
  # --------------------------------------------------------------------------
  # L8: Desktop platform matrix (Linux / macOS / Windows)
  # --------------------------------------------------------------------------
  desktop-matrix:
    name: "L8 desktop — ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        working-directory: frontend
        run: flutter pub get

      - name: Install build tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update -qq && sudo apt-get install -y cmake build-essential

      - name: Install build tools (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install cmake

      - name: Build native engine (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: frontend
        run: |
          cmake -B build/native/linux -S native/engine -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native/linux --parallel $(nproc)

      - name: Build native engine (macOS)
        if: matrix.os == 'macos-latest'
        working-directory: frontend
        run: |
          cmake -B build/native/macos -S native/engine -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native/macos --parallel $(sysctl -n hw.logicalcpu)

      - name: Build native engine (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: frontend
        shell: pwsh
        run: |
          cmake -B build/native/windows -S native/engine -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native/windows --config Release

      - name: Set native lib env (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "CHESSRECAST_NATIVE_ENGINE_LIB=${{ github.workspace }}/frontend/build/native/linux/libchess_engine.so" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=${{ github.workspace }}/frontend/build/native/linux" >> $GITHUB_ENV

      - name: Set native lib env (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          echo "CHESSRECAST_NATIVE_ENGINE_LIB=${{ github.workspace }}/frontend/build/native/macos/libchess_engine.dylib" >> $GITHUB_ENV
          echo "DYLD_LIBRARY_PATH=${{ github.workspace }}/frontend/build/native/macos" >> $GITHUB_ENV

      - name: Set native lib env (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_ENV "CHESSRECAST_NATIVE_ENGINE_LIB=${{ github.workspace }}\frontend\build\native\windows\Release\chess_engine.dll"
          Add-Content $env:GITHUB_ENV "PATH=${{ github.workspace }}\frontend\build\native\windows\Release;$env:PATH"

      - name: L4 — Engine-correlation tests
        working-directory: frontend
        run: |
          flutter test \
            test/heir_engine_regression_test.dart \
            test/kings_battle_engine_regression_test.dart \
            test/mercenary_engine_regression_test.dart \
            test/succession_engine_regression_test.dart \
            -r compact --concurrency=2

      - name: L5 — Transport tests (cross-platform validation)
        working-directory: frontend
        run: flutter test test/p2p/transport/ -r compact --concurrency=2

      - name: L8 — Cross-platform smoke (P2P unit tests on this OS)
        working-directory: frontend
        run: flutter test test/p2p/ -r compact --concurrency=2

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2p-device-matrix-${{ matrix.os }}-${{ github.run_id }}
          path: /tmp/agent-runs/
          retention-days: 30

  # --------------------------------------------------------------------------
  # L8: Web platform (Chrome)
  # --------------------------------------------------------------------------
  web-platform:
    name: "L8 web — Chrome"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      - name: Flutter pub get
        working-directory: frontend
        run: flutter pub get
      - name: L1-L2 P2P unit tests (web / JS platform)
        working-directory: frontend
        # Note: native FFI tests are skipped on web; only pure-Dart P2P tests run
        run: |
          flutter test test/p2p/protocol/ test/p2p/identity/ \
            --platform chrome --concurrency=2 || true
          # `|| true` pending https://github.com/flutter/flutter/issues/web-test-native
          # Remove when FFI-free P2P test subset is confirmed stable on web runner.

  # --------------------------------------------------------------------------
  # L8: Physical device farm (Android + iOS) — conditional, requires secrets
  # --------------------------------------------------------------------------
  device-farm:
    name: "L8 device farm"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_device_farm == 'true'
    needs: [desktop-matrix]

    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      - name: Flutter pub get
        working-directory: frontend
        run: flutter pub get
      - name: Build Android APK (integration tests)
        working-directory: frontend
        run: flutter build apk --release --target=integration_test/p2p_device_smoke_test.dart
      - name: Run on Firebase Test Lab
        env:
          FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FTL_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "Device farm run: Firebase Test Lab Android matrix"
          # Actual gcloud command — enabled when FIREBASE_PROJECT secret is set:
          # gcloud firebase test android run \
          #   --type instrumentation \
          #   --app frontend/build/app/outputs/flutter-apk/app-release.apk \
          #   --test frontend/build/app/outputs/flutter-apk/app-release.apk \
          #   --device model=Pixel4,version=30 \
          #   --device model=SamsungA52,version=31 \
          #   --timeout 10m
          echo "INFO: Device farm gate is wired but requires FTL secret provisioning"
