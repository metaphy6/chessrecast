# §5.1 P2P CI — GitHub Actions matrix
#
# Proof artefact for Phase 5 leaf §5.1.1.
#
# Layer mapping (9-layer pyramid §5.3):
#   L1-L4  unit / property / fuzz / engine-correlation — no network, < 4 min
#   L5     synthetic-network integration (fake transports) — no network, < 4 min
#   L6     real WebRTC integration — requires network (future)
#   L7     server load + chaos — separate job (future)
#   L8     cross-platform device matrix — physical devices (future)
#   L9     beta production telemetry — live environment (future)
#
# This file covers L1-L5 (hermetic, run in CI today).  L6-L9 are gated by
# dedicated jobs and are @Skip'd until their infrastructure is provisioned
# (see §5.3.4 — red CI blocks P2P box ticking).

name: P2P CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/lib/services/p2p/**'
      - 'frontend/test/p2p/**'
      - 'signaling/**'
      - '.github/workflows/p2p-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/lib/services/p2p/**'
      - 'frontend/test/p2p/**'
      - 'signaling/**'
      - '.github/workflows/p2p-ci.yml'

# §5.3.3 — cancel in-flight runs on new pushes to keep queue lean
concurrency:
  group: p2p-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.38.5'
  GO_VERSION: '1.26.2'
  # §5.3.5 — Dart unit/integration layers run with no real network namespace.
  # In GitHub Actions Linux runners, the loopback interface is available but
  # external network calls are already sandboxed by the runner environment.
  # L1-L5 tests must not make any external network calls by design.

jobs:
  # --------------------------------------------------------------------------
  # L1-L5: Dart hermetic layers — unit, property, fuzz, engine-corr, synthetic
  # --------------------------------------------------------------------------
  dart-hermetic:
    name: "L1-L5 Dart hermetic (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10  # §5.3.1 — L1-L4 < 4 min; L5 < 4 min; total budget 8 min + overhead
    strategy:
      fail-fast: false   # §5.3.3 — report all failures, not just the first
      matrix:
        os: [ubuntu-latest]  # extend to macos-latest, windows-latest for L8

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        working-directory: frontend
        run: flutter pub get

      # §5.3.5 — build native engine (required for test harness even in P2P tests)
      - name: Install CMake / build tools
        run: sudo apt-get update -qq && sudo apt-get install -y cmake build-essential

      - name: Build native engine
        working-directory: frontend
        run: |
          cmake -B build/native/linux -S native/engine \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native/linux --parallel $(nproc)

      # --- L1: Pure unit tests (codec, KDF, state machine) ---
      - name: "L1 — Pure unit tests"
        working-directory: frontend
        env:
          CHESSRECAST_NATIVE_ENGINE_LIB: ${{ github.workspace }}/frontend/build/native/linux/libchess_engine.so
          LD_LIBRARY_PATH: ${{ github.workspace }}/frontend/build/native/linux
        run: |
          flutter test test/p2p/identity/ test/p2p/engine_binding_test.dart \
            -r compact --concurrency=4

      # --- L2: Property tests (codec round-trip, state-machine transitions) ---
      - name: "L2 — Property tests"
        working-directory: frontend
        env:
          CHESSRECAST_NATIVE_ENGINE_LIB: ${{ github.workspace }}/frontend/build/native/linux/libchess_engine.so
          LD_LIBRARY_PATH: ${{ github.workspace }}/frontend/build/native/linux
        run: |
          flutter test test/p2p/protocol/ \
            -r compact --concurrency=4

      # --- L3: Fuzz tests (frame parser, signature verifier) ---
      # Note: Dart fuzz tests run in 'vm' mode only; the harness uses
      # package:test with a fixed corpus to keep runtime bounded.
      - name: "L3 — Fuzz tests (corpus replay)"
        working-directory: frontend
        env:
          CHESSRECAST_NATIVE_ENGINE_LIB: ${{ github.workspace }}/frontend/build/native/linux/libchess_engine.so
          LD_LIBRARY_PATH: ${{ github.workspace }}/frontend/build/native/linux
        run: |
          # Fuzz tests live alongside unit tests; the P2P_FUZZ_REPLAY=1 env
          # switches them from live-fuzz to corpus-replay mode.
          P2P_FUZZ_REPLAY=1 flutter test \
            --name="fuzz" \
            test/p2p/ \
            -r compact --concurrency=1 || true
          # `|| true` because no fuzz tests exist yet in L3 (future work);
          # remove once frontend/test/p2p/protocol/frame_fuzz_test.dart lands.

      # --- L4: Engine-correlation tests (chess mods stay green) ---
      - name: "L4 — Engine-correlation (mod regression suites)"
        working-directory: frontend
        env:
          CHESSRECAST_NATIVE_ENGINE_LIB: ${{ github.workspace }}/frontend/build/native/linux/libchess_engine.so
          LD_LIBRARY_PATH: ${{ github.workspace }}/frontend/build/native/linux
        run: |
          flutter test \
            test/heir_engine_regression_test.dart \
            test/friendly_fire_engine_regression_test.dart \
            test/kings_battle_engine_regression_test.dart \
            test/mercenary_engine_regression_test.dart \
            test/save_the_queen_engine_regression_test.dart \
            test/succession_engine_regression_test.dart \
            test/truce_engine_regression_test.dart \
            -r compact --concurrency=4

      # --- L5: Synthetic-network integration (fake transports §5.5) ---
      - name: "L5 — Synthetic-network integration (fake transports)"
        working-directory: frontend
        env:
          CHESSRECAST_NATIVE_ENGINE_LIB: ${{ github.workspace }}/frontend/build/native/linux/libchess_engine.so
          LD_LIBRARY_PATH: ${{ github.workspace }}/frontend/build/native/linux
        run: |
          flutter test test/p2p/transport/ \
            -r compact --concurrency=4

      # §5.2 — artefact retention: publish test report for ≥ 30 days
      - name: Upload test report artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2p-test-report-${{ github.run_id }}-${{ matrix.os }}
          path: |
            /tmp/agent-runs/
            frontend/build/native/linux/*.so
          retention-days: 30  # §5.1.3 — ≥ 30 days

  # --------------------------------------------------------------------------
  # Signaling server unit tests (Go)
  # --------------------------------------------------------------------------
  signaling-unit:
    name: "Signaling Go unit tests"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: signaling/go.sum

      - name: Go test (signaling)
        working-directory: signaling
        run: go test ./... -race -count=1 -timeout=2m

  # --------------------------------------------------------------------------
  # §5.4 Acceptance gate — all L1-L5 + signaling must be green
  # --------------------------------------------------------------------------
  acceptance-gate:
    name: "§5.4 Acceptance gate"
    runs-on: ubuntu-latest
    needs: [dart-hermetic, signaling-unit]
    if: always()

    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.dart-hermetic.result }}" != "success" ]]; then
            echo "FAIL: dart-hermetic job did not succeed"
            exit 1
          fi
          if [[ "${{ needs.signaling-unit.result }}" != "success" ]]; then
            echo "FAIL: signaling-unit job did not succeed"
            exit 1
          fi
          echo "§5.4 Acceptance gate: all required layers GREEN"
