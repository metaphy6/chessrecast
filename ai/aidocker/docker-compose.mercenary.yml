services:
  mercenary-trainer:
    build:
      context: .
      dockerfile: .Dockerfile.trainer
    container_name: chessrecast-mercenary-trainer
    # Runtime auto-detected (nvidia if available, else CPU)
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0
      - PYTHONUNBUFFERED=1
      # Training/Test configuration
      - TEST_MODE=${TEST_MODE:-true}           # true=test mode, false=training
      - MOVE_DELAY=${MOVE_DELAY:-0.3}          # Delay between moves in seconds (0.1-10)
    ports:
      - "8765:8765"  # WebSocket port for live training viewer
    volumes:
      - ../trainer:/workspace
      - trainer-checkpoints:/workspace/checkpoints
      - trainer-models:/workspace/models
    working_dir: /workspace
    # Use environment variables for test mode and delay
    command: >
      sh -c "python train_mercenary_1800.py 
      $${TEST_MODE:+--test} 
      --delay $${MOVE_DELAY}"
    shm_size: '8gb'  # Increased shared memory for large batches

volumes:
  trainer-checkpoints:
  trainer-models:
