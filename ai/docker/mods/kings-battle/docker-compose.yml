# ╔══════════════════════════════════════════════════════════════╗
# ║  ⚔️👑 Kings Battle Mod — AI Training                       ║
# ║  Kings gain attack powers                                    ║
# ╚══════════════════════════════════════════════════════════════╝
services:
  kings-battle-trainer:
    build:
      context: ../../..
      dockerfile: docker/Dockerfile
      args:
        TRAIN_SCRIPT: mods/train_kings_battle.py
    container_name: chessrecast-kings-battle-trainer
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0
      - PYTHONUNBUFFERED=1
      - TEST_MODE=${TEST_MODE:-false}
      - MOVE_DELAY=${MOVE_DELAY:-0.3}
    ports:
      - "8769:8765"
    volumes:
      - ../../../trainer:/workspace
      - kings-battle-checkpoints:/workspace/checkpoints
      - kings-battle-models:/workspace/models
      - kings-battle-data:/workspace/data
    working_dir: /workspace
    command: >
      sh -c "if [ \"$${TEST_MODE}\" = 'true' ]; then
        python mods/train_kings_battle.py --test --delay $${MOVE_DELAY};
      else
        python mods/train_kings_battle.py --delay $${MOVE_DELAY};
      fi"
    shm_size: '8gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  kings-battle-checkpoints:
  kings-battle-models:
  kings-battle-data:
