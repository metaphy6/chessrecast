# ╔══════════════════════════════════════════════════════════════╗
# ║  Friendly Fire Mod — AI Training                             ║
# ║  Pieces can capture their own team                           ║
# ╚══════════════════════════════════════════════════════════════╝
services:
  friendly-fire-trainer:
    build:
      context: ../../..
      dockerfile: docker/Dockerfile
      args:
        TRAIN_SCRIPT: mods/train_friendly_fire.py
    container_name: chessrecast-friendly-fire-trainer
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0
      - PYTHONUNBUFFERED=1
      - TEST_MODE=${TEST_MODE:-false}
      - MOVE_DELAY=${MOVE_DELAY:-0.3}
    ports:
      - "8768:8765"
    volumes:
      - ../../../trainer:/workspace
      - friendly-fire-checkpoints:/workspace/checkpoints
      - friendly-fire-models:/workspace/models
      - friendly-fire-data:/workspace/data
    working_dir: /workspace
    command: >
      sh -c "if [ \"$${TEST_MODE}\" = 'true' ]; then
        python mods/train_friendly_fire.py --test --delay $${MOVE_DELAY};
      else
        python mods/train_friendly_fire.py --delay $${MOVE_DELAY};
      fi"
    shm_size: '8gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  friendly-fire-checkpoints:
  friendly-fire-models:
  friendly-fire-data:
