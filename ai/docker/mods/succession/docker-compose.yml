# ╔══════════════════════════════════════════════════════════════╗
# ║  Succession Mod — AI Training                                ║
# ║  When king is captured, next piece in line becomes king      ║
# ╚══════════════════════════════════════════════════════════════╝
services:
  succession-trainer:
    build:
      context: ../../..
      dockerfile: docker/Dockerfile
      args:
        TRAIN_SCRIPT: mods/train_succession.py
    container_name: chessrecast-succession-trainer
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0
      - PYTHONUNBUFFERED=1
      - TEST_MODE=${TEST_MODE:-false}
      - MOVE_DELAY=${MOVE_DELAY:-0.3}
    ports:
      - "8771:8765"
    volumes:
      - ../../../trainer:/workspace
      - succession-checkpoints:/workspace/checkpoints
      - succession-models:/workspace/models
      - succession-data:/workspace/data
    working_dir: /workspace
    command: >
      sh -c "if [ \"$${TEST_MODE}\" = 'true' ]; then
        python mods/train_succession.py --test --delay $${MOVE_DELAY};
      else
        python mods/train_succession.py --delay $${MOVE_DELAY};
      fi"
    shm_size: '8gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  succession-checkpoints:
  succession-models:
  succession-data:
