# ╔══════════════════════════════════════════════════════════════╗
# ║  Classic Mod — AI Training                                   ║
# ║  Standard chess rules                                        ║
# ╚══════════════════════════════════════════════════════════════╝
services:
  classic-trainer:
    build:
      context: ../../..
      dockerfile: docker/Dockerfile
      args:
        TRAIN_SCRIPT: mods/train_classic.py
    container_name: chessrecast-classic-trainer
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0
      - PYTHONUNBUFFERED=1
      - TEST_MODE=${TEST_MODE:-false}
      - MOVE_DELAY=${MOVE_DELAY:-0.3}
    ports:
      - "8772:8765"
    volumes:
      - ../../../trainer:/workspace
      - classic-checkpoints:/workspace/checkpoints
      - classic-models:/workspace/models
      - classic-data:/workspace/data
    working_dir: /workspace
    command: >
      sh -c "if [ \"$${TEST_MODE}\" = 'true' ]; then
        python mods/train_classic.py --test --delay $${MOVE_DELAY};
      else
        python mods/train_classic.py --delay $${MOVE_DELAY};
      fi"
    shm_size: '8gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  classic-checkpoints:
  classic-models:
  classic-data:
